---
layout: default
---
<article class="page">
    <header class="page-header wrap-text">
        <h1>{{ page.title }}</h1>
        {%- if page.lede %}
        <p class="post-lede">{{ page.lede }}</p>
        {%- endif %}
    </header>
    <div class="prose wrap-text">
        {{ content }}
    </div>
</article>
