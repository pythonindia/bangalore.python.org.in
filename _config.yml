# Site
name: "BangPypers"
description: "The Bangalore Python User Group"
meta_description: "BangPypers is Bengaluru's Python user group. Free monthly meetups with talks, workshops and dev sprints since 2005."
logo: '/assets/images/logo.jpg'
favicon: '/assets/images/brand/favicon-32.png'
# Brand marks in assets/images/brand/ are cropped from https://github.com/bangpypers/assets
og_img: '/assets/images/logo_og.jpg'
post_default_img: '/assets/images/posts/bangpyperscover.jpg'
baseurl: ""
url: "https://bangalore.pythonindia.org"
lang: en
repository: "pythonindia/bangalore.python.org.in"
founded: 2005
# Loaded only in production builds (JEKYLL_ENV=production).
google_analytics: 'G-2KWW473BLG'
# Comments: https://giscus.app
giscus:
  repo: "pythonindia/bangalore.python.org.in"
  repo_id: "MDEwOlJlcG9zaXRvcnk2OTY5MjI2"
  category: "General"
  category_id: "MDE4OkRpc2N1c3Npb25DYXRlZ29yeTMyOTE2MzA0"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-archives
  - jekyll-sitemap

# Archives
jekyll-archives:
  enabled:
    - categories
    - year
    - month
  layout: archive
  permalinks:
    category: '/archives/:name/'
    year: '/blog/:year/'
    month: '/blog/:year/:month/'

collections:
  authors:
    output: true
    permalink: /authors/:path/

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "archive"
      type: "authors"
  - scope:
      path: "_posts/community"
    values:
      layout: "post"
      permalink: /community-blog/:title/
      # Exclude from jekyll-paginate; still published in the Community Blog.
      hidden: true

# Pagination
paginate: 6
paginate_path: /page:num/

# Other
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
highlighter: rouge

# Jekyll skips dot-directories unless they are listed here.
include: [.well-known]
exclude: [vendor, scripts, swag, README.md, SECURITY.md, Gemfile, Gemfile.lock]
